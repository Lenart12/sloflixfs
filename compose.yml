x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  sloflix:
    image: lenart12/sloflixfs:latest
    build: .  # `docker compose up --build` builds from source instead
    restart: unless-stopped
    env_file: .env  # every SLOFLIX_* setting set there is passed through
    environment:
      SLOFLIX_USER: ${SLOFLIX_USER:?set SLOFLIX_USER in .env}
      SLOFLIX_PASS: ${SLOFLIX_PASS:?set SLOFLIX_PASS in .env}
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - cache:/cache
      # The mount appears at $SLOFLIX_DIR/library. Binding the parent keeps a mount left dead by a crash
      # from blocking startup; sloflix clears it when it starts.
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /mnt/sloflix
        bind:
          propagation: rshared
          create_host_path: true
    healthcheck:
      test: ["CMD", "test", "-d", "/mnt/sloflix/library/Movies"]
      interval: 30s
      start_period: 10s
    logging: *logging

  jellyfin:
    image: jellyfin/jellyfin
    restart: unless-stopped
    depends_on:
      sloflix:
        condition: service_healthy
    ports:
      - 8096:8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Libraries: /media/sloflix/library/Movies and /media/sloflix/library/Shows
      - type: bind
        source: ${SLOFLIX_DIR:-/mnt/sloflix}
        target: /media/sloflix
        read_only: true
        bind:
          propagation: rslave
    logging: *logging

volumes:
  cache:
  jellyfin-config:
  jellyfin-cache:
