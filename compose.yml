# sloflixfs and Jellyfin. Set your sloflix credentials below, then run `docker compose up -d`.
# Options are described in the README's Configuration section.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  sloflix:
    image: lenart12/sloflixfs:latest
    build: .  # used only by `docker compose up --build` in a clone of the repository
    restart: unless-stopped
    environment:
      SLOFLIX_USER: your-username
      SLOFLIX_PASS: your-password
      # SLOFLIX_PROBE_CACHE: 500
      # SLOFLIX_JELLYFIN_URL: http://jellyfin:8096
      # SLOFLIX_JELLYFIN_KEY: your-api-key
      # SLOFLIX_LIMIT_MOVIES: 20
      # SLOFLIX_LIMIT_SHOWS: 2
      # SLOFLIX_LOG_LEVEL: debug
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - cache:/cache
      # The mount appears on the host at /mnt/sloflix/library. Binding the parent keeps a mount left dead
      # by a crash from blocking startup; sloflix clears it when it starts.
      - type: bind
        source: /mnt/sloflix
        target: /mnt/sloflix
        bind:
          propagation: rshared
          create_host_path: true
    healthcheck:
      test: ["CMD", "test", "-d", "/mnt/sloflix/library/Movies"]
      interval: 30s
      start_period: 10s
    logging: *logging

  jellyfin:
    image: jellyfin/jellyfin
    restart: unless-stopped
    depends_on:
      sloflix:
        condition: service_healthy
    ports:
      - 8096:8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Libraries: /media/sloflix/library/Movies and /media/sloflix/library/Shows
      - type: bind
        source: /mnt/sloflix
        target: /media/sloflix
        read_only: true
        bind:
          propagation: rslave
    logging: *logging

volumes:
  cache:
  jellyfin-config:
  jellyfin-cache:
